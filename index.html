  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mychat</title>
  <link rel="manifest" href="manifest.json">
<script>
window.mychatBio = {
  async available(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } },
  async register(){ try {
    const c = await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'mychat',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'mychat',displayName:'mychat'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});
    localStorage.setItem('mychat_bio', btoa(String.fromCharCode(...new Uint8Array(c.rawId)))); return true; } catch(e){ return false; } },
  async verify(){ try {
    const id = localStorage.getItem('mychat_bio'); if(!id) return false;
    const raw = Uint8Array.from(atob(id), ch => ch.charCodeAt(0));
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:raw}],userVerification:'required',timeout:60000}}); return true; } catch(e){ return false; } }
};
</script></head>
